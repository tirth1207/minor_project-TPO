name: One-time TPO notification UX fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch notification and breadcrumb UX
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_required(s, old, new, path):
              if old not in s:
                  raise SystemExit(f"Pattern not found in {path}: {old[:120]!r}")
              return s.replace(old, new, 1)

          # Fix the two contexts that currently store the API response as an array and have a malformed effect.
          context_repls = [
              ('notification: () => Promise<void>', 'notification: { notifications: any[]; count: number; hasMore: boolean }'),
              ('const [notification,setNotification] = React.useState([])', 'const [notification,setNotification] = React.useState<{ notifications: any[]; count: number; hasMore: boolean }>({ notifications: [], count: 0, hasMore: false })'),
              ('const [notification,setNotification]= React.useState([])', 'const [notification,setNotification] = React.useState<{ notifications: any[]; count: number; hasMore: boolean }>({ notifications: [], count: 0, hasMore: false })'),
              ('setNotification([])', 'setNotification({ notifications: [], count: 0, hasMore: false })'),
              ('React.useEffect(() => { fetchNotification(), [fetchNotification]})', 'React.useEffect(() => { fetchNotification() }, [fetchNotification])'),
          ]
          for path in ['src/app/student/student-context.tsx', 'src/app/company/company-context.tsx']:
              p = Path(path)
              s = p.read_text()
              for old, new in context_repls:
                  if old in s:
                      s = s.replace(old, new, 1)
              p.write_text(s)

          # Replace the old read-only popovers with the shared notification center.
          for path in [
              'src/app/student/layout.tsx',
              'src/app/company/layout.tsx',
              'src/app/college-admin/layout.tsx',
              'src/app/super-admin/layout.tsx',
          ]:
              p = Path(path)
              s = p.read_text()
              s2 = re.sub(r'\n\s*<Popover>.*?</Popover>\s*', '\n            <NotificationCenter />\n', s, count=1, flags=re.S)
              if s2 == s:
                  raise SystemExit(f'Notification popover not found in {path}')
              s = s2
              if 'from "@/components/notification-center"' not in s:
                  s = s.replace('import { AppSidebar } from "@/components/app-sidebar"\n', 'import { AppSidebar } from "@/components/app-sidebar"\nimport { NotificationCenter } from "@/components/notification-center"\n', 1)
              if path.endswith('student/layout.tsx'):
                  s = s.replace('  const {notification} = useStudent()\n  const unreadCount =\n  notification.notifications?.filter((item: any) => !item.is_read).length ?? 0\n', '')
              elif path.endswith('company/layout.tsx'):
                  s = s.replace('  const {notification} = useCompany()\n  const unreadCount =\n  notification.notifications?.filter((item: any) => !item.is_read).length ?? 0\n', '')
              else:
                  s = re.sub(r'\n\s*const unreadCount =\n\s*notifications\.notifications\?\.filter\(.*?\n', '\n', s, count=1)
              s = s.replace('import { Popover, PopoverTrigger, PopoverContent } from "@/components/ui/popover"\n', '')
              s = s.replace('import { Popover, PopoverContent, PopoverTrigger } from "@/components/ui/popover"\n', '')
              s = s.replace('import { Button } from "@/components/ui/button"\n', '')
              p.write_text(s)

          # Mentor did not have a header notification bell; give it the same fully functional center.
          p = Path('src/app/mentor/layout.tsx')
          s = p.read_text()
          if 'from "@/components/notification-center"' not in s:
              s = s.replace('import { AppSidebar } from "@/components/app-sidebar"\n', 'import { AppSidebar } from "@/components/app-sidebar"\nimport { NotificationCenter } from "@/components/notification-center"\n', 1)
          marker = '          <div className="flex items-center gap-3">\n'
          if marker not in s:
              raise SystemExit('Mentor header marker not found')
          if '            <NotificationCenter />' not in s:
              s = s.replace(marker, marker + '            <NotificationCenter />\n', 1)
          p.write_text(s)

          print('Notification UX patch prepared.')
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-tpo-fix.yml
          git add src .github/workflows/one-time-tpo-fix.yml
          git commit -m "fix: make notifications and role breadcrumbs functional" || exit 0
          git push
